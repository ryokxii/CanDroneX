# Démarrage : cp .env.example .env && docker compose up --build -d
# Seuls la passerelle (8080), Keycloak (8081) et Swagger UI (8090) sont publiés.

x-postgres: &postgres
  image: postgres:16
  environment: &postgres-env
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  networks: [candronex-net]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    interval: 5s
    timeout: 5s
    retries: 12

x-service: &service
  networks: [candronex-net]
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-service-env: &service-env
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  JWT_JWKS_URI: http://keycloak:8080/realms/candronex/protocol/openid-connect/certs
  JWT_ISSUER: http://localhost:8081/realms/candronex
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Émetteur (iss) fixe, que le jeton soit obtenu par localhost:8081 ou keycloak:8080.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      CANDRONEX_ADMIN_SECRET: ${CANDRONEX_ADMIN_SECRET}
      ACCES_SERVICE_SECRET: ${ACCES_SERVICE_SECRET}
      INSPECTRA_DEMO_SECRET: ${INSPECTRA_DEMO_SECRET}
      AEROTECH_DEMO_SECRET: ${AEROTECH_DEMO_SECRET}
      JETON_COURT_SECRET: ${JETON_COURT_SECRET}
      ORDER_SERVICE_SECRET: ${ORDER_SERVICE_SECRET}
    volumes:
      - ./keycloak/realm-candronex.json:/opt/keycloak/data/import/realm-candronex.json:ro
    ports:
      - "8081:8080"
    networks: [candronex-net]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      retries: 20

  api-gateway:
    image: devopsfaith/krakend:2.7
    volumes:
      - ./gateway/krakend.json:/etc/krakend/krakend.json:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [candronex-net]
    depends_on:
      keycloak: { condition: service_healthy }

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      URLS: '[{"url":"/api/gateway.yaml","name":"API B2B"},{"url":"/api/drone-service.yaml","name":"Drone Service"},{"url":"/api/order-service.yaml","name":"Order Service"},{"url":"/api/slice-service.yaml","name":"Slice Service interne"}]'
    volumes:
      - ./docs/api:/usr/share/nginx/html/api:ro
    ports:
      - "8090:8080"
    networks: [candronex-net]

  drone-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: drone
    volumes: [drone-data:/var/lib/postgresql/data]

  order-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: order
    volumes: [order-data:/var/lib/postgresql/data]

  slice-db:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: slice
    volumes: [slice-data:/var/lib/postgresql/data]

  # Pas de "ports:" : les services ne sont joignables que sur candronex-net.
  drone-service:
    <<: *service
    build: { context: ., args: { SERVICE: drone-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://drone-db:5432/drone
    depends_on:
      drone-db: { condition: service_healthy }

  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://order-db:5432/order
      DRONE_SERVICE_URL: http://drone-service:8080
      DRONE_TIMEOUT: 2s
      SLICE_SERVICE_URL: http://slice-service:8080
      SLICE_TIMEOUT: 2s
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/candronex/protocol/openid-connect/token
      ORDER_SERVICE_SECRET: ${ORDER_SERVICE_SECRET}
      ACTIVATION_POLL_INTERVAL: 2s
    depends_on:
      order-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  slice-service:
    <<: *service
    build: { context: ., args: { SERVICE: slice-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://slice-db:5432/slice
      NETWORK_ADAPTER: mock
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-1200}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.1}
      MOCK_TIMEOUT_RATE: ${MOCK_TIMEOUT_RATE:-0.05}
      MOCK_TIMEOUT: 5s
    depends_on:
      slice-db: { condition: service_healthy }

volumes:
  drone-data:
  order-data:
  slice-data:

networks:
  candronex-net:
    driver: bridge
