spring:
  application:
    name: slice-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slice}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}

  jpa:
    # Seules les migrations Flyway créent le schéma.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

candronex:
  jwt:
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8081/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}
  network:
    adapter: ${NETWORK_ADAPTER:mock}
    mock:
      latency: ${MOCK_LATENCY_MS:1200}
      failure-rate: ${MOCK_FAILURE_RATE:0.1}
      timeout-rate: ${MOCK_TIMEOUT_RATE:0.05}
      timeout: ${MOCK_TIMEOUT:5s}
  activation:
    recheck-interval: ${ACTIVATION_RECHECK_INTERVAL:10s}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level service=${spring.application.name} correlationId=%X{correlationId} %logger{0} - %msg%n"
  level:
    root: INFO
