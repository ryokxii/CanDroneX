spring:
  application:
    name: drone-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/drone}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}

  jpa:
    # Seules les migrations Flyway créent le schéma.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

candronex:
  jwt:
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8081/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level service=${spring.application.name} correlationId=%X{correlationId} %logger{0} - %msg%n"
  level:
    root: INFO
