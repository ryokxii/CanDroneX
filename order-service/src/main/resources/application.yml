spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}

  jpa:
    # Seules les migrations Flyway créent le schéma.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

candronex:
  jwt:
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8081/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}
  drone-service:
    url: ${DRONE_SERVICE_URL:http://localhost:8082}
    timeout: ${DRONE_TIMEOUT:2s}
  slice-service:
    url: ${SLICE_SERVICE_URL:http://localhost:8083}
    timeout: ${SLICE_TIMEOUT:2s}
  service-token:
    url: ${KEYCLOAK_TOKEN_URL:http://localhost:8081/realms/candronex/protocol/openid-connect/token}
    client-id: order-service
    client-secret: ${ORDER_SERVICE_SECRET:}
  activation:
    poll-interval: ${ACTIVATION_POLL_INTERVAL:2s}
    poll-batch: 200

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level service=${spring.application.name} correlationId=%X{correlationId} %logger{0} - %msg%n"
  level:
    root: INFO
